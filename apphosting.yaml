# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# This app is a static Vite SPA; all Firebase web-config values have safe
# public defaults baked into src/react-app/lib/firebase.ts, so no build-time
# secrets are required here. Add `env:` entries with `secret:` only if that
# changes in the future.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

# neighbours.games is the canonical domain. server.js 301-redirects only the
# hosts in CANONICAL_REDIRECT_FROM (www.neighbours.games + the default
# *.hosted.app URL) to it; neighbours.cloud is intentionally NOT listed, so it
# keeps serving independently. /api/ is exempt so webhooks aren't redirected.
env:
  - variable: CANONICAL_HOST
    value: neighbours.games
    availability:
      - RUNTIME
  - variable: CANONICAL_REDIRECT_FROM
    value: www.neighbours.games,icare-quiz--icare-quiz-arena.us-east4.hosted.app
    availability:
      - RUNTIME
